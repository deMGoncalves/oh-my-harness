name: Check site

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**"]
  pull_request:
    paths: ["docs/**", "scripts/**"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links e assets internos existem
        run: python3 scripts/check-site.py
